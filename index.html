<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Lab</title>
<meta name="description" content="Personal voice, presentation and persuasion trainer.">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: single phone column. Sticky top bar, one screen at a time, fixed record dock on the take screen. */
:root {
  --bg: #f3f2ef; --surface: #ffffff; --sunk: #ebe9e4; --line: #dedbd4;
  --fg: #17181c; --muted: #5f6068;
  --rec: #d23f2a; --rec-soft: rgba(210, 63, 42, 0.10);
  --ok: #2f7d4f; --ok-soft: rgba(47, 125, 79, 0.12);
  --warn: #8a5a00; --warn-soft: rgba(176, 120, 0, 0.12);
  --meter: #2d4a7a; --hl: rgba(210, 63, 42, 0.16);
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161c; --surface: #1c1f27; --sunk: #171a21; --line: #2c303b; --fg: #eceae5; --muted: #9a9ca6;
    --rec: #ff6a52; --rec-soft: rgba(255, 106, 82, 0.14);
    --ok: #6fcf97; --ok-soft: rgba(111, 207, 151, 0.14);
    --warn: #e6b450; --warn-soft: rgba(230, 180, 80, 0.14);
    --meter: #8fb0e8; --hl: rgba(255, 106, 82, 0.22);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  min-height: 100dvh; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
}
button, input { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar h1 { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { min-width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 14px; font-weight: 600; }
.mode-pill { font-family: var(--font-data); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.mode-pill.mock { background: var(--warn-soft); color: var(--warn); }
.mode-pill.live { background: var(--ok-soft); color: var(--ok); }
.mode-pill.off { background: var(--sunk); color: var(--muted); }

main {
  max-width: 560px; margin: 0 auto; display: grid; gap: 14px; padding-top: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.label { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 20px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.muted { color: var(--muted); font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 15px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.danger { color: var(--rec); border-color: var(--rec); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .grow { flex: 1; }

.prompt { font-size: 19px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-data); font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }

/* Recorder */
.rec-stage { display: grid; justify-items: center; gap: 14px; padding: 8px 0; }
.rec-btn { width: 84px; height: 84px; border-radius: 50%; background: var(--rec); color: #fff; font-family: var(--font-data); font-weight: 600; font-size: 14px; letter-spacing: 0.06em; box-shadow: 0 6px 22px var(--rec-soft); position: relative; }
.rec-btn.on::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--rec); animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(0.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
.timer { font-family: var(--font-data); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 8px; width: 100%; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0%; background: var(--meter); transition: width 60ms linear; }
canvas.trace { width: 100%; height: 80px; display: block; background: var(--sunk); border-radius: 10px; }
audio { width: 100%; }

/* Metrics */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metric { background: var(--sunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.metric .k { font-size: 12px; color: var(--muted); }
.metric .v { font-family: var(--font-data); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.metric .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.metric .n { font-size: 12px; color: var(--muted); line-height: 1.4; }
.metric.na .v { color: var(--muted); }
.group-title { font-weight: 600; font-size: 15px; }

.transcript { font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
.transcript mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; }
.transcript mark.cand { background: none; text-decoration: underline dotted var(--warn) 2px; text-underline-offset: 3px; }

.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.err { background: var(--rec-soft); color: var(--rec); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }

.list { display: grid; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.item .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); font-family: var(--font-data); }
.item .body { flex: 1; min-width: 0; }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 14px; }

.field { display: grid; gap: 6px; }
.field input[type=password], .field input[type=text] { min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--rec); }
.status-line { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.confirm { border: 1px solid var(--rec); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--rec); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="icon-btn" id="backBtn" hidden aria-label="Back">←</button>
    <h1 id="title">Voice Lab</h1>
    <span class="mode-pill off" id="modePill">…</span>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">Settings</button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:16px">Voice Lab needs JavaScript.</p></noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
